name: Testes
# A validação roda automaticamente em cada push e pull request.
on: [push, pull_request]
jobs:
  pytest:
    # Ambiente limpo para tornar a execução reproduzível no CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
